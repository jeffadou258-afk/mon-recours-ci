# /etc/systemd/journald.conf.d/mon-recours-ci.conf (NON installé)
# Les journaux du moteur et de l'interface ne contiennent aucun récit, mais ils
# portent une empreinte courte de l'identifiant de consultation et des adresses
# techniques. Ils sont conservés 7 jours au plus sur ce serveur dédié.
#   sudo install -D -m 644 journald-mon-recours-ci.conf /etc/systemd/journald.conf.d/mon-recours-ci.conf
#   sudo systemctl restart systemd-journald
[Journal]
MaxRetentionSec=7day
SystemMaxUse=500M
