# Contrôles de l'interface web (web/) — exécutés par GitHub Actions.
# Aucun déploiement, aucun secret utilisé : les clés nécessaires aux tests sont
# tirées au hasard pendant l'exécution puis jetées.

name: Interface web — controles

on:
  push:
    branches: [feature/interface-web, feature/domaine-famille, feature/produit-fonctionnel, audit/24-domaines, corpus/collecte-24-domaines, corpus/collecte-autonome]
    paths: ["web/**", "core/**", "bin/**", "tests/**", "KNOWLEDGE/**", "agent.py", "config.py", "requirements.txt", ".github/workflows/interface-web.yml"]
  pull_request:
    paths: ["web/**", "core/**", "bin/**", "tests/**", "KNOWLEDGE/**", "agent.py", "config.py", "requirements.txt", ".github/workflows/interface-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fige les versions exactes : génère package-lock.json et l'ajoute à la branche
  # feature/interface-web s'il a changé (jamais sur main, jamais sur une PR).
  verrou-des-versions:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/interface-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer package-lock.json (sans exécuter de script)
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Ajouter le verrou à la branche s'il a changé
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "::notice title=package-lock::inchangé"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Verrou des versions (package-lock.json) généré par la CI"
          git push origin HEAD:feature/interface-web
          echo "::notice title=package-lock::ajouté à la branche ($(git rev-parse --short HEAD))"

  controles:
    needs: [verrou-des-versions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      # Sur un envoi, on contrôle la tête de branche, verrou des versions compris.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # L'export PDF des courriers dépend de fpdf2 (core/documents.py). Sans cette
      # installation, les tests PDF échouent en silence côté application : ils sont
      # donc exercés ici avec la dépendance réellement présente.
      - name: Dépendances Python du moteur
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt
          python -c "import fpdf; print('::notice title=Dépendances PDF::fpdf2 ' + fpdf.__version__)"

      - name: Clés de test éphémères (masquées)
        run: |
          K=$(node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))")
          S=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
          echo "::add-mask::$K"
          echo "::add-mask::$S"
          echo "MONRECOURS_API_KEY=$K" >> "$GITHUB_ENV"
          echo "MONRECOURS_SESSION_SECRET=$S" >> "$GITHUB_ENV"

      # Les scripts d'installation (esbuild, sharp) ne sont pas exécutés, comme
      # décidé dans package.json (allowScripts). Les tests vérifient que tout
      # fonctionne sans eux.
      - name: Installation (sans scripts d'installation)
        run: |
          node --version && npm --version
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-fund; else npm install --ignore-scripts --no-fund; fi
          echo "::notice title=Versions::$(node -p "['next','react','react-dom','postcss','playwright','esbuild','typescript'].map(n=>{try{return n+'@'+JSON.parse(require('fs').readFileSync('node_modules/'+n+'/package.json','utf8')).version}catch{return n+'@absent'}}).join(' ')")"

      - name: Copies de postcss installées (doivent être >= 8.5.23)
        run: |
          npm ls postcss --all || true
          V=$(npm ls postcss --all --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=new Set();(function f(o){for(const [k,x] of Object.entries(o.dependencies||{})){if(k==='postcss')v.add(x.version);f(x)}})(JSON.parse(d));console.log([...v].join(' '))})")
          echo "::notice title=postcss::versions installées : $V"

      - name: Audit npm
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > ../audit.json || true
          npm audit
          R=$(node -e "const a=require('../audit.json');const m=a.metadata.vulnerabilities;console.log(Object.entries(m).map(([k,v])=>k+'='+v).join(' '))")
          echo "::notice title=npm audit::$R"
          npm audit --audit-level=low

      - name: TypeScript
        if: always()
        run: npm run typecheck

      - name: Tests unitaires et composants
        if: always()
        run: |
          npm test 2>&1 | tee ../unitaires.txt
          echo "::notice title=Tests unitaires::$(grep -E '^# (tests|pass|fail)' ../unitaires.txt | tr '\n' ' ')"
          ! grep -qE '^# fail [1-9]' ../unitaires.txt

      - name: Construction Next.js
        if: always()
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee ../build.txt; then
            echo "::error title=Construction Next.js (échec)::$(tail -40 ../build.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          RESUME=$(grep -E "Compiled|Generating static|^Route|^[┌├└]|First Load|^ƒ|^○" ../build.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Construction Next.js::$RESUME"

      - name: Secrets dans le code client
        if: always()
        run: |
          set -o pipefail
          npm run verifier:secrets 2>&1 | tee ../secrets.txt
          echo "::notice title=Secrets::$(tail -1 ../secrets.txt)"

      - name: Intégration avec le moteur Python réel
        if: always()
        run: |
          npm run test:integration 2>&1 | tee ../integration.txt
          echo "::notice title=Integration::$(grep -E '^# (tests|pass|fail)' ../integration.txt | tr '\n' ' ')"
          ! grep -qE '^# fail [1-9]' ../integration.txt

      - name: Navigateur Chromium
        if: always()
        run: npx playwright install --with-deps chromium

      - name: Bout en bout (Chromium mobile, moteur réel)
        if: always()
        run: |
          npm run test:e2e 2>&1 | tee ../e2e.txt
          echo "::notice title=E2E::$(grep -E '^# (tests|pass|fail)' ../e2e.txt | tr '\n' ' ')"
          if grep -qE '^not ok' ../e2e.txt; then
            echo "::warning title=E2E echecs::$(grep -E -A14 "^not ok" ../e2e.txt | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          ! grep -qE '^# fail [1-9]' ../e2e.txt

      # Les PDF officiels ne sont pas dans le dépôt : mode explicite qui vérifie
      # les empreintes des textes extraits à la place (core/corpus.py).
      # `bin/enregistrer_tests.py` appelle la MÊME suite (tests/run_all.py) et
      # conserve le résultat : date, commit, chiffres, noms des échecs, durée.
      # Son code de sortie est celui de la suite, et `pipefail` le propage : un
      # échec de test fait échouer l'étape, il n'est jamais converti en succès.
      - name: Tests du moteur
        if: always()
        working-directory: .
        env:
          MONRECOURS_PDF_NON_DISTRIBUES: "1"
        run: |
          set -o pipefail
          python3 bin/enregistrer_tests.py --etiquette ci 2>&1 | tee moteur.txt || {
            echo "::error title=Moteur (échecs)::$(grep -E '^TESTS=|^  - |^VERDICT' moteur.txt | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          echo "::notice title=Moteur::$(grep -E '^Tests |^TESTS=' moteur.txt | head -2 | tr '\n' ' ')"

      # ESLint n'est pas une dépendance du projet : il est installé ici, sans
      # modifier package.json ni le verrou, APRÈS la construction (sinon
      # `next build` lancerait le linter et changerait de comportement).
      - name: ESLint
        if: always()
        run: |
          npm install --no-save --ignore-scripts --no-fund --no-audit eslint@9 eslint-config-next@15.5 @eslint/eslintrc@3
          set +e
          npx eslint . --max-warnings=0 2>&1 | tee ../eslint.txt
          S=${PIPESTATUS[0]}
          R=$(grep -E '✖ [0-9]+ problem' ../eslint.txt || echo "0 problème")
          echo "::notice title=ESLint::$(npx eslint --version) — $R (code $S)"
          if [ "$S" != "0" ]; then
            echo "::warning title=ESLint détails::$(head -60 ../eslint.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit $S

      - name: Résultat final de l'audit
        if: always()
        run: test "${{ steps.audit.outcome }}" = "success"

      - name: Conserver le package-lock.json, l'audit et les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-interface-web
          path: |
            web/package-lock.json
            audit.json
            web/tests/e2e/captures/
            moteur.txt
            KNOWLEDGE/qualite/historique_tests.jsonl
          retention-days: 14
