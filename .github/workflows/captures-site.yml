# Captures d'écran du VRAI site (next build + next start + moteur Python réel),
# pour contrôler l'apparence sans déployer. Les PNG sont commités sur cette
# branche (outils/captures-site). Aucun secret : clés générées à la volée.
name: Captures du site

on:
  push:
    branches: [outils/captures-site]
    paths: [".github/workflows/captures-site.yml", "CIBLE"]

permissions:
  contents: write

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: outil
      - name: Code à photographier
        run: echo "CIBLE=$(cat outil/CIBLE)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CIBLE }}
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install -q -r site/requirements.txt
          cd site/web && npm ci --ignore-scripts --no-fund --no-audit && npx playwright install --with-deps chromium
      - name: Construire et démarrer (moteur réel + Next)
        run: |
          K=$(openssl rand -hex 24); S=$(openssl rand -hex 32)
          echo "::add-mask::$K"; echo "::add-mask::$S"
          cd site
          MONRECOURS_API_KEY=$K MONRECOURS_PDF_NON_DISTRIBUES=1 nohup python bin/serveur_api.py --port 8765 --debit 1000 > /tmp/moteur.log 2>&1 &
          cd web
          npm run build > /tmp/build.log 2>&1 || { tail -40 /tmp/build.log; exit 1; }
          MONRECOURS_API_KEY=$K MONRECOURS_SESSION_SECRET=$S MONRECOURS_API_URL=http://127.0.0.1:8765 PORT=3000 \
            nohup npx next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/sante >/dev/null && break; sleep 1; done
          curl -sf -o /dev/null -w "sante %{http_code}\n" http://127.0.0.1:3000/api/sante
      - name: Captures
        working-directory: site/web
        run: |
          mkdir -p "$GITHUB_WORKSPACE/outil/captures"
          cat > /tmp/captures.mjs <<'JS'
          import { chromium } from "playwright";
          const sortie = process.env.SORTIE;
          const b = await chromium.launch();
          async function serie(nom, options) {
            const ctx = await b.newContext(options);
            const p = await ctx.newPage();
            const erreurs = [];
            p.on("pageerror", (e) => erreurs.push(String(e)));
            p.on("console", (m) => { if (m.type() === "error") erreurs.push(m.text()); });
            await p.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await p.waitForTimeout(2500);
            await p.screenshot({ path: `${sortie}/${nom}-01-haut.png` });
            const hauteur = await p.evaluate(() => document.documentElement.scrollHeight);
            const vue = options.viewport.height;
            let n = 2;
            for (let y = vue; y < hauteur; y += vue) {
              await p.evaluate((v) => window.scrollTo(0, v), y);
              await p.waitForTimeout(1300);
              await p.screenshot({ path: `${sortie}/${nom}-${String(n++).padStart(2, "0")}-defile.png` });
            }
            await p.goto("http://127.0.0.1:3000/consultation", { waitUntil: "networkidle" });
            await p.waitForTimeout(1200);
            await p.screenshot({ path: `${sortie}/${nom}-20-consultation.png`, fullPage: true });
            await p.getByRole("button", { name: /Mon bailleur garde ma caution/ }).click();
            await p.getByRole("button", { name: "Analyser ma situation" }).click();
            await p.waitForTimeout(700);
            await p.screenshot({ path: `${sortie}/${nom}-21-attente.png` });
            await p.getByRole("heading", { name: "Quelques précisions" }).waitFor({ timeout: 30000 });
            await p.screenshot({ path: `${sortie}/${nom}-22-questions.png`, fullPage: true });
            const deborde = await p.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            console.log(nom, "débordement horizontal:", deborde, "erreurs JS:", JSON.stringify(erreurs));
            await ctx.close();
          }
          await serie("mobile", { viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
          await serie("ordinateur", { viewport: { width: 1366, height: 800 } });
          await b.close();
          JS
          SORTIE="$GITHUB_WORKSPACE/outil/captures" node /tmp/captures.mjs
          ls -la "$GITHUB_WORKSPACE/outil/captures"
      - name: Journaux (en cas d'échec)
        if: failure()
        run: tail -30 /tmp/web.log /tmp/moteur.log || true
      - name: Publier les captures sur la branche
        working-directory: outil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures
          git commit -qm "Captures du site ($CIBLE)" && git push origin HEAD:outils/captures-site
