# Collecte documentaire du corpus juridique — exécutée MANUELLEMENT par GitHub
# Actions (onglet Actions → « Corpus — collecte documentaire » → Run workflow).
#
# POURQUOI PAS AU PUSH : ce workflow ÉCRIT dans le dépôt distant (PDF sur
# `corpus/archives-pdf`, constats sur la branche de travail). Déclenché par un
# push, il ajoutait un commit automatique par-dessus les commits poussés. Il ne
# se déclenche donc plus que sur demande explicite, et les écritures distantes
# sont elles-mêmes soumises à l'entrée `publier` (défaut : faux).
#
# Ce que fait ce workflow :
#   1. lit KNOWLEDGE/collecte/manifeste.json ;
#   2. télécharge chaque document (bin/collecte_distante.py), mesure son empreinte,
#      extrait le texte, fait l'OCR français des pages scannées ;
#   3. conserve PDF et constats en ARTEFACTS (aucune écriture distante) ;
#   4. si `publier` est coché : pousse les PDF sur `corpus/archives-pdf` (jamais
#      sur main) et les constats sur la branche de travail.
# Il ne modifie ni la base du corpus ni les fiches : l'intégration est locale et
# passe par les garde-fous du moteur.

name: Corpus — collecte documentaire

on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Retraiter les entrées déjà collectées"
        type: boolean
        default: false
      ocr:
        description: "OCR sur le runner (sinon : OCR local, bin/ocr_local.py)"
        type: boolean
        default: false
      publier:
        description: "Publier sur le dépôt : PDF vers corpus/archives-pdf et constats sur la branche courante"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collecte-corpus
  cancel-in-progress: false

jobs:
  collecte:
    if: github.ref == 'refs/heads/corpus/collecte-24-domaines' || github.ref == 'refs/heads/corpus/collecte-autonome'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Écriture nécessaire UNIQUEMENT à l'étape « publier » (opt-in). Le jeton du
    # workflow est en lecture seule par défaut ; cette permission ne couvre pas
    # `main`, et aucune commande du fichier ne pousse vers `main`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Outils (paquets Ubuntu officiels)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf tesseract-ocr tesseract-ocr-fra
          pdftotext -v 2>&1 | head -1; tesseract --version | head -1; tesseract --list-langs

      - name: Collecte
        env:
          COLLECTE_DOSSIER_PDF: ${{ runner.temp }}/pdf
          COLLECTE_BUDGET_S: "2400"
          # Sur corpus/collecte-autonome, l'OCR est fait dans l'espace de travail
          # (modèle tessdata_best) : le runner se limite au téléchargement.
          COLLECTE_OCR: ${{ (github.ref_name == 'corpus/collecte-24-domaines' || inputs.ocr) && '1' || '0' }}
        run: |
          OPTIONS=""
          if [ "${{ inputs.forcer }}" = "true" ]; then OPTIONS="--forcer"; fi
          python3 -I bin/collecte_distante.py $OPTIONS

      - name: Conserver les PDF téléchargés (artefact, sans écriture distante)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-collectes
          path: ${{ runner.temp }}/pdf
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive des PDF (branche corpus/archives-pdf)
        # Écriture distante : uniquement si `publier` a été coché à la main.
        if: inputs.publier
        env:
          PDF: ${{ runner.temp }}/pdf
        run: |
          git config user.name "collecte-corpus[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d "$PDF" ] || [ -z "$(ls -A "$PDF")" ]; then echo "aucun PDF"; exit 0; fi
          ARCH="$RUNNER_TEMP/archives"
          if git ls-remote --exit-code --heads origin corpus/archives-pdf >/dev/null; then
            git fetch -q origin corpus/archives-pdf
            git worktree add -q "$ARCH" -B corpus/archives-pdf FETCH_HEAD
          else
            git worktree add -q --detach "$ARCH"
            git -C "$ARCH" switch -q --orphan corpus/archives-pdf
          fi
          mkdir -p "$ARCH/pdf"
          cp "$PDF"/*.pdf "$ARCH/pdf/"
          (cd "$ARCH/pdf" && sha256sum *.pdf > ../SHA256SUMS)
          printf '%s\n' "# Archive des PDF collectés" "" \
            "Branche d'archive : fichiers bruts téléchargés par le workflow « Corpus — collecte documentaire »." \
            "Provenance, catégorie (officielle ou secondaire) et constats : KNOWLEDGE/collecte/resultats/ sur ${{ github.ref_name }}." \
            "Un fichier présent ici n'est NI authentifié NI réputé en vigueur." > "$ARCH/README.md"
          git -C "$ARCH" add -f pdf SHA256SUMS README.md
          if git -C "$ARCH" diff --cached --quiet; then echo "archive inchangée"; exit 0; fi
          git -C "$ARCH" commit -q -m "Archive des PDF collectés (run ${{ github.run_id }})"
          git -C "$ARCH" push -q origin corpus/archives-pdf

      - name: Conserver les constats (artefact, sans écriture distante)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constats-collecte
          path: |
            KNOWLEDGE/collecte/resultats
            KNOWLEDGE/collecte/textes
            KNOWLEDGE/collecte/derniere_execution.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Constats (branche de travail)
        # Écriture distante : uniquement si `publier` a été coché à la main.
        if: inputs.publier
        # Les constats de CE run font foi pour les entrées qu'il a traitées : ils
        # sont recopiés sur l'état le plus récent de la branche (pas de rebase,
        # qui échoue dès qu'un même fichier de constat a changé des deux côtés).
        run: |
          SAUVE="$RUNNER_TEMP/constats"
          mkdir -p "$SAUVE"
          cp -r KNOWLEDGE/collecte/resultats KNOWLEDGE/collecte/textes KNOWLEDGE/collecte/derniere_execution.json "$SAUVE/"
          for essai in 1 2 3; do
            git fetch -q origin "${{ github.ref_name }}"
            git reset -q --hard FETCH_HEAD
            cp -r "$SAUVE"/* KNOWLEDGE/collecte/
            git add KNOWLEDGE/collecte/resultats KNOWLEDGE/collecte/textes KNOWLEDGE/collecte/derniere_execution.json
            if git diff --cached --quiet; then echo "aucun constat nouveau"; exit 0; fi
            git commit -q -m "Collecte : constats du run ${{ github.run_id }}"
            git push -q origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
