# Collecte documentaire du corpus juridique — exécutée MANUELLEMENT par GitHub
# Actions (onglet Actions → « Corpus — collecte documentaire » → Run workflow).
#
# DEUX JOBS, DEUX NIVEAUX DE DROIT.
#
#   collecte     contents: read   — télécharge, extrait, mesure ; dépose les PDF et
#                                   les constats en artefacts. Aucun push, aucun
#                                   commit, aucun jeton d'écriture.
#   publication  contents: write  — ne s'exécute que si `publier` vaut EXPLICITEMENT
#                                   true ET que la branche est une branche corpus/*
#                                   autorisée. Récupère les artefacts du job
#                                   `collecte`, vérifie leur contenu, puis pousse
#                                   les PDF sur `corpus/archives-pdf` et les
#                                   constats sur la branche de travail.
#
# POURQUOI PAS AU PUSH : ce workflow ÉCRIT dans le dépôt distant. Déclenché par un
# push, il ajoutait un commit automatique par-dessus les commits poussés. Il ne
# part donc que sur demande explicite.
#
# CE QU'IL NE FAIT PAS : il ne modifie ni la base du corpus ni les fiches, il ne
# touche jamais `main`, et il ne déploie rien.

name: Corpus — collecte documentaire

on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Retraiter les entrées déjà collectées"
        type: boolean
        default: false
      ocr:
        description: "OCR sur le runner (sinon : OCR local, bin/ocr_local.py)"
        type: boolean
        default: false
      publier:
        description: "PUBLIER : PDF vers corpus/archives-pdf et constats sur la branche courante"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collecte-corpus
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. COLLECTE — lecture seule. Produit des artefacts, n'écrit rien de distant.
  # ---------------------------------------------------------------------------
  collecte:
    if: github.ref == 'refs/heads/corpus/collecte-24-domaines' || github.ref == 'refs/heads/corpus/collecte-autonome'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Outils (paquets Ubuntu officiels)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf tesseract-ocr tesseract-ocr-fra
          pdftotext -v 2>&1 | head -1; tesseract --version | head -1; tesseract --list-langs

      - name: Collecte
        env:
          COLLECTE_DOSSIER_PDF: ${{ runner.temp }}/pdf
          COLLECTE_BUDGET_S: "2400"
          # Sur corpus/collecte-autonome, l'OCR est fait dans l'espace de travail
          # (modèle tessdata_best) : le runner se limite au téléchargement.
          COLLECTE_OCR: ${{ (github.ref_name == 'corpus/collecte-24-domaines' || inputs.ocr) && '1' || '0' }}
        run: |
          OPTIONS=""
          if [ "${{ inputs.forcer }}" = "true" ]; then OPTIONS="--forcer"; fi
          python3 -I bin/collecte_distante.py $OPTIONS

      - name: Conserver les PDF téléchargés (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-collectes
          path: ${{ runner.temp }}/pdf
          if-no-files-found: warn
          retention-days: 14

      - name: Conserver les constats (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constats-collecte
          # Racine commune = KNOWLEDGE/collecte : l'artefact contient
          # `resultats/`, `textes/` et `derniere_execution.json`.
          # `warn` et non `error` : un run sans constat n'est pas une panne, et
          # c'est le job `publication` qui refuse un artefact vide ou absent.
          path: |
            KNOWLEDGE/collecte/resultats
            KNOWLEDGE/collecte/textes
            KNOWLEDGE/collecte/derniere_execution.json
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. PUBLICATION — écriture, sur autorisation explicite uniquement.
  # ---------------------------------------------------------------------------
  publication:
    needs: collecte
    # Deux conditions cumulatives : la demande explicite, et une branche autorisée.
    if: >-
      inputs.publier == true &&
      (github.ref_name == 'corpus/collecte-24-domaines' || github.ref_name == 'corpus/collecte-autonome')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Refuser toute cible hors branches corpus/*
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "branche cible : $REF"
          case "$REF" in
            corpus/collecte-24-domaines|corpus/collecte-autonome) ;;
            *) echo "::error::publication refusée depuis la branche « $REF »"; exit 1 ;;
          esac
          if [ "$REF" = "main" ]; then echo "::error::publication interdite depuis main"; exit 1; fi
          if [ -z "$REF" ]; then echo "::error::branche cible vide"; exit 1; fi

      - name: Récupérer les PDF du job de collecte
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pdf-collectes
          path: ${{ runner.temp }}/pdf

      - name: Récupérer les constats du job de collecte
        uses: actions/download-artifact@v4
        with:
          name: constats-collecte
          path: ${{ runner.temp }}/constats

      - name: Vérifier les artefacts reçus
        env:
          PDF: ${{ runner.temp }}/pdf
          CONSTATS: ${{ runner.temp }}/constats
        run: |
          # Les constats sont le produit principal : leur absence est une erreur,
          # pas un cas nominal. On refuse de publier un run sans constats.
          if [ ! -d "$CONSTATS" ]; then echo "::error::artefact de constats absent"; exit 1; fi
          if [ ! -d "$CONSTATS/resultats" ] && [ ! -d "$CONSTATS/textes" ]; then
            echo "::error::artefact de constats vide ou mal structuré"; ls -la "$CONSTATS"; exit 1
          fi
          N=$(find "$CONSTATS" -type f | wc -l | tr -d ' ')
          P=0
          if [ -d "$PDF" ]; then P=$(find "$PDF" -name '*.pdf' -type f | wc -l | tr -d ' '); fi
          echo "constats : $N fichier(s) · PDF : $P"
          if [ "$N" -eq 0 ]; then echo "::error::aucun constat à publier"; exit 1; fi

      - name: Archive des PDF (branche corpus/archives-pdf)
        env:
          PDF: ${{ runner.temp }}/pdf
        run: |
          git config user.name "collecte-corpus[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d "$PDF" ] || [ -z "$(ls -A "$PDF" 2>/dev/null)" ]; then echo "aucun PDF : rien à archiver"; exit 0; fi
          ARCH="$RUNNER_TEMP/archives"
          if git ls-remote --exit-code --heads origin corpus/archives-pdf >/dev/null; then
            git fetch -q origin corpus/archives-pdf
            git worktree add -q "$ARCH" -B corpus/archives-pdf FETCH_HEAD
          else
            git worktree add -q --detach "$ARCH"
            git -C "$ARCH" switch -q --orphan corpus/archives-pdf
          fi
          mkdir -p "$ARCH/pdf"
          cp "$PDF"/*.pdf "$ARCH/pdf/"
          (cd "$ARCH/pdf" && sha256sum *.pdf > ../SHA256SUMS)
          printf '%s\n' "# Archive des PDF collectés" "" \
            "Branche d'archive : fichiers bruts téléchargés par le workflow « Corpus — collecte documentaire »." \
            "Provenance, catégorie (officielle ou secondaire) et constats : KNOWLEDGE/collecte/resultats/ sur ${{ github.ref_name }}." \
            "Un fichier présent ici n'est NI authentifié NI réputé en vigueur." > "$ARCH/README.md"
          git -C "$ARCH" add -f pdf SHA256SUMS README.md
          if git -C "$ARCH" diff --cached --quiet; then echo "archive inchangée"; exit 0; fi
          git -C "$ARCH" commit -q -m "Archive des PDF collectés (run ${{ github.run_id }})"
          git -C "$ARCH" push -q origin corpus/archives-pdf

      - name: Constats (branche de travail)
        # Les constats de CE run font foi pour les entrées qu'il a traitées : ils
        # sont recopiés sur l'état le plus récent de la branche (pas de rebase,
        # qui échoue dès qu'un même fichier de constat a changé des deux côtés).
        env:
          CONSTATS: ${{ runner.temp }}/constats
        run: |
          git config user.name "collecte-corpus[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REF="${{ github.ref_name }}"
          for essai in 1 2 3; do
            git fetch -q origin "$REF"
            git reset -q --hard FETCH_HEAD
            cp -r "$CONSTATS"/* KNOWLEDGE/collecte/
            git add KNOWLEDGE/collecte/resultats KNOWLEDGE/collecte/textes KNOWLEDGE/collecte/derniere_execution.json
            if git diff --cached --quiet; then echo "aucun constat nouveau"; exit 0; fi
            git commit -q -m "Collecte : constats du run ${{ github.run_id }}"
            git push -q origin "HEAD:$REF" && exit 0
            sleep 5
          done
          exit 1
